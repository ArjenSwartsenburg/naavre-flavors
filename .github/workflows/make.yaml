name: Make

on:
  release:
    types: [published]
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      release_version:
        description: >-
          Publish images and base_image_tags.json under this existing release
          tag (fork workaround: release events do not trigger workflows here)
        type: string
        required: false
        default: ''

jobs:
  configure-workflow:
    name: Configure workflow
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      matrix: ${{ steps.list-flavors.outputs.matrix }}
    steps:
      - id: skip_check
        name: Configure skip-duplicate-actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths_ignore: '["**/README.md"]'
          do_not_skip: '["workflow_dispatch", "schedule", "release"]'
      - uses: actions/checkout@v4
      - id: list-flavors
        name: List flavors
        run: |
          # Only vanilla is maintained in this fork: the other flavor dirs
          # depend on the removed docker/ default Dockerfiles (now in naavre-base)
          matrix=$(find ./flavors/vanilla -mindepth 1 -maxdepth 1 -name 'flavor_config.yaml' | xargs yq ea -o=j -I=0 '[.]')
          echo "matrix={\"include\":$(echo $matrix)}" | tee -a $GITHUB_OUTPUT

  flavors:
    name: Flavor ${{ matrix.flavor_name }}
    uses: ./.github/workflows/make-flavor.yaml
    needs: [configure-workflow]
    if: needs.configure-workflow.outputs.should_skip != 'true'
    permissions:
      contents: read
      packages: write
    with:
      flavor_name: ${{ matrix.flavor_name }}
      image_repo: 'ghcr.io/arjenswartsenburg'
      ci_image_version: ci-${{ github.sha }}
      rel_image_version: ${{ inputs.release_version || github.ref_name }}
      build_jupyter: ${{ matrix.build_jupyter }}
      build_cell_base: ${{ matrix.build_cell_base }}
      free_disk_space: ${{ matrix.free_disk_space }}
      publish: ${{ github.event_name == 'release' || inputs.release_version != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure-workflow.outputs.matrix) }}

  save-base-image-tags:
    name: Save base image tags
    runs-on: ubuntu-latest
    needs: [flavors]
    if: ${{ github.event_name == 'release' || inputs.release_version != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate base_image_tags.json
        run: |
          find ./flavors/vanilla -mindepth 1 -maxdepth 1 -name 'flavor_config.yaml' | \
            xargs yq ea -o=j '
              [ . as $flavor | . |= (
                [$flavor.flavor_name] + ($flavor.aliases // []) | filter($flavor.build_cell_base) | map({
                  "key": .,
                  "value": {
                    "build": "ghcr.io/arjenswartsenburg/naavre-fl-\($flavor.flavor_name)-cell-build:${{ inputs.release_version || github.ref_name }}",
                    "runtime": "ghcr.io/arjenswartsenburg/naavre-fl-\($flavor.flavor_name)-cell-runtime:${{ inputs.release_version || github.ref_name }}"
                  }
                })
              )] | .[] as $item ireduce([]; . + $item) | from_entries
            ' | \
            tee /tmp/base_image_tags.json

      - name: Add base_image_tags.json to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /tmp/base_image_tags.json
          asset_name: base_image_tags.json
          tag: refs/tags/${{ inputs.release_version || github.ref_name }}
